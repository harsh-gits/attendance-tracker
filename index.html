<!doctype html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Attendance</title>
  <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4fb" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="hero">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="rga"/><stop offset="1" class="rgb"/></linearGradient></defs>
        <circle class="ring-bg" cx="60" cy="60" r="52"/>
        <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" pathLength="100"/>
        <circle class="ring-min" cx="60" cy="60" r="52" pathLength="100"/>
      </svg>
      <div class="hero-text">
        <div class="sem" id="sem"></div>
        <div class="overall" id="overall"></div>
        <div class="sub" id="overallSub"></div>
      </div>
    </div>
  </header>
  <main>
    <section id="tab-day" class="tab active"></section>
    <section id="tab-subj" class="tab"></section>
    <section id="tab-cal" class="tab"></section>
    <section id="tab-log" class="tab"></section>
    <section id="tab-set" class="tab"></section>
  </main>
  <nav class="tabs">
    <button data-tab="day" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2M17 3v2M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm4 9 2 2 4-4"/></svg><span>Today</span></button>
    <button data-tab="subj"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></svg><span>Subjects</span></button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2M17 3v2M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01"/></svg><span>Calendar</span></button>
    <button data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4l3 2M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg><span>Changes</span></button>
    <button data-tab="set"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4"/></svg><span>Settings</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="importer.js"></script>
  <script src="app.js"></script>
</body>
</html>
